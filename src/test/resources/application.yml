spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:itopsmonitor;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

ops:
  mocks:
    ledger-force-down: true
  monitor:
    poll-interval-ms: 60000
    targets: []
