server:
  port: 8080

spring:
  application:
    name: it-ops-monitor

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

ops:
  mocks:
    # Set to false to make the ledger mock return 200 instead of 503
    ledger-force-down: true
  monitor:
    poll-interval-ms: 15000
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    targets:
      - name: payments-api
        url: http://127.0.0.1:8080/mocks/payments
      - name: fx-api
        url: http://127.0.0.1:8080/mocks/fx
      - name: ledger-api
        url: http://127.0.0.1:8080/mocks/ledger
